name: Bug
description: Report incorrect or unexpected behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Brief description
      description: Briefly describe the problem.

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected result
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual_result
    attributes:
      label: Actual result
      description: What happens instead?
    validations:
      required: true

  - type: textarea
    id: additional_technical_info
    attributes:
      label: Additional / technical information
      description: Add relevant logs, screenshots, environment details, or other technical context.
    validations:
      required: false
